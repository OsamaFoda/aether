// Aether startup file. Firefox skips the first line of this file, so it must stay a comment.
// Sets Aether's default settings, then loads the interface layer from aether-ui/.

defaultPref("xpinstall.signatures.required", false);   // allow our own unsigned add-ons, like Sip
defaultPref("sidebar.revamp", true);                    // Firefox's new sidebar...
defaultPref("sidebar.verticalTabs", true);              // ...with tabs down the side (switchable)
defaultPref("browser.tabs.insertAfterCurrent", false);  // new tabs go at the end of the list
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("toolkit.telemetry.enabled", false);

try {
  const ui = Cc["@mozilla.org/file/directory_service;1"]
    .getService(Ci.nsIProperties)
    .get("GreD", Ci.nsIFile);
  ui.append("aether-ui");
  const manifest = ui.clone();
  manifest.append("chrome.manifest");
  if (manifest.exists()) {
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
    ChromeUtils.importESModule("chrome://aether/content/boot.sys.mjs");
  }
} catch (e) {
  Cu.reportError(e);
}
