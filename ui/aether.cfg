// Aether startup file. Firefox skips the first line of this file, so it must stay a comment.
// Sets Aether's default settings, then loads the interface layer from aether-ui/.

defaultPref("xpinstall.signatures.required", false);   // allow our own unsigned add-ons, like Sip
defaultPref("sidebar.revamp", true);                    // Firefox's new sidebar...
defaultPref("sidebar.verticalTabs", true);              // ...with tabs down the side (switchable)
defaultPref("browser.tabs.insertAfterCurrent", false);  // new tabs go at the end of the list
defaultPref("browser.startup.homepage", "chrome://aether/content/newtab/newtab.html");  // new windows
// Firefox's AI link previews and smart tab groups download AI models on first use: costly on
// capped internet, and Shift+click is Aether's Peek.
defaultPref("browser.ml.linkPreview.enabled", false);
defaultPref("browser.tabs.groups.smart.enabled", false);
defaultPref("sidebar.verticalTabs.dragToPinPromo.dismissed", true);  // Firefox's pinned-tabs promo card, with its fox
defaultPref("browser.vpn_promo.enabled", false);                     // and its other ads for Mozilla products
defaultPref("browser.promo.focus.enabled", false);
defaultPref("browser.promo.pin.enabled", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("toolkit.telemetry.enabled", false);
// The liquid glass lens (styles/lens.svg) bends the background with an SVG displacement map;
// let the graphics engine draw those two SVG filter steps itself.
defaultPref("gfx.webrender.svg-filter-effects.feimage", true);
defaultPref("gfx.webrender.svg-filter-effects.fedisplacementmap", true);

try {
  const ui = Cc["@mozilla.org/file/directory_service;1"]
    .getService(Ci.nsIProperties)
    .get("GreD", Ci.nsIFile);
  ui.append("aether-ui");
  const manifest = ui.clone();
  manifest.append("chrome.manifest");
  if (manifest.exists()) {
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
    ChromeUtils.importESModule("chrome://aether/content/boot.sys.mjs");
  }
} catch (e) {
  Cu.reportError(e);
}
