<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Space Void -->
    <linearGradient id="zs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1224" />
      <stop offset="100%" stop-color="#04050b" />
    </linearGradient>

    <!-- Squircle Border -->
    <linearGradient id="zs-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1" />
    </linearGradient>

    <!-- Outer Atmospheric Halo -->
    <radialGradient id="zs-halo" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Volumetric Spherical Shading -->
    <radialGradient id="zs-sphere-body" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="92%" stop-color="#020617" />
      <stop offset="100%" stop-color="#06b6d4" />
    </radialGradient>

    <!-- Internal Nebula Swirl 1 (Turquoise) -->
    <linearGradient id="zs-nebula-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Internal Nebula Swirl 2 (Violet / Lavender) -->
    <linearGradient id="zs-nebula-2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </linearGradient>

    <!-- Internal Starlight Flare -->
    <radialGradient id="zs-core-star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Top-Left Curved Primary Specular Sheen -->
    <linearGradient id="zs-specular-top" x1="30%" y1="15%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom-Right Fresnel Rim Glow -->
    <linearGradient id="zs-fresnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Contact Shadow -->
    <radialGradient id="zs-contact-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Path for Internal Nebula -->
    <clipPath id="zs-sphere-clip">
      <circle cx="256" cy="245" r="145" />
    </clipPath>

    <!-- Drop Shadows -->
    <filter id="zs-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="zs-orb-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#02040a" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#zs-bg)" filter="url(#zs-shadow)" />

  <!-- Outer Atmospheric Halo -->
  <circle cx="256" cy="245" r="195" fill="url(#zs-halo)" />

  <!-- Floating Contact Shadow Beneath Orb -->
  <ellipse cx="256" cy="415" rx="115" ry="22" fill="url(#zs-contact-shadow)" />

  <!-- Floating Zen Marble Group -->
  <g filter="url(#zs-orb-shadow)">
    <!-- Base Volumetric Sphere Body -->
    <circle cx="256" cy="245" r="145" fill="url(#zs-sphere-body)" />

    <!-- Internal Volumetric Nebula Clouds (Clipped Inside Sphere) -->
    <g clip-path="url(#zs-sphere-clip)">
      <!-- Swirling Turquoise Wave Wisp -->
      <path d="M 120,310 C 140,210 200,160 270,175 C 340,190 380,260 360,330 C 330,280 270,230 220,240 C 170,250 140,290 120,310 Z"
            fill="url(#zs-nebula-1)" />

      <!-- Intertwining Violet / Lilac Wave Wisp -->
      <path d="M 380,180 C 350,260 290,310 210,300 C 150,290 130,230 160,170 C 185,215 240,255 295,245 C 340,235 365,200 380,180 Z"
            fill="url(#zs-nebula-2)" />

      <!-- Glowing Stardust Particles -->
      <circle cx="230" cy="210" r="2.5" fill="#ffffff" />
      <circle cx="285" cy="230" r="3" fill="#a5f3fc" />
      <circle cx="205" cy="270" r="2" fill="#fed7aa" />
      <circle cx="320" cy="275" r="2.5" fill="#fbcfe8" />
      <circle cx="260" cy="285" r="3" fill="#ffffff" />
      <circle cx="170" cy="215" r="2" fill="#67e8f9" />

      <!-- Central Incandescent Core Nebula Flare -->
      <circle cx="256" cy="245" r="45" fill="url(#zs-core-star)" opacity="0.85" />
      <circle cx="256" cy="245" r="7" fill="#ffffff" />
    </g>

    <!-- Glass Surface Optical Reflections (Outside Clip) -->
    <!-- Top-Left Primary Crescent Specular Arc -->
    <path d="M 155,185 C 175,135 235,115 295,125 C 245,125 195,145 175,190 Z" fill="url(#zs-specular-top)" opacity="0.9" />

    <!-- Sharp Specular Glint Spot -->
    <ellipse cx="205" cy="180" rx="18" ry="11" fill="#ffffff" opacity="0.85" transform="rotate(-35 205 180)" />
    <circle cx="212" cy="184" r="4" fill="#ffffff" />

    <!-- Bottom-Right Secondary Fresnel Rim Highlight -->
    <path d="M 230,388 C 295,388 375,345 395,280 C 390,335 320,380 250,385 Z" fill="url(#zs-fresnel)" />

    <!-- Fine Glass Rim Contour Stroke -->
    <circle cx="256" cy="245" r="145" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3" />
  </g>

  <!-- Beveled Squircle Rim Border -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#zs-border)" stroke-width="2.5" />
  <path d="M 144,33 L 368,33" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
</svg>
